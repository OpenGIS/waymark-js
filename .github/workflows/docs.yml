name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "screenshots/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/llms-full.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check llms bundle freshness
        run: npm run check:llms

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build docs site
        run: npm run docs:generate
        env:
          # The deploy target is derived at deploy time from the Pages action's
          # own output — no site URL is committed. Its full base URL drives both
          # the canonical URLs and the asset base path (derived in
          # docs/nuxt.config.js).
          NUXT_PUBLIC_PRODUCTION_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
