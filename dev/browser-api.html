<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waymark Browser API Fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
      }

      .map {
        width: 640px;
        height: 360px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div id="map" class="map"></div>

    <script type="module">
      import { Map } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import { createInstance } from "../src/entry.js";
      import { getCoreByMap } from "../src/runtime/runtimeRegistry.js";
      import { absolutizeSpriteURLs } from "../tests/fixtures/basemap/style.mjs";

      window.waymarkFixture = {
        createInstance,
        createContainer(id) {
          const container = document.createElement("div");
          container.id = id;
          container.className = "map";
          document.body.appendChild(container);
          return container;
        },
        makeMap({ id = "map", style, ...options } = {}) {
          const container =
            document.getElementById(id) ??
            window.waymarkFixture.createContainer(id);

          // Pin fade off so symbol/icon paint does not settle mid-transition
          // (callers can still override via `options`).
          const map = new Map({ fadeDuration: 0, container, ...options });

          // MapLibre requires an absolute sprite URL; resolve the vendored
          // style's root-relative sprite against the current origin.
          map.setStyle(style ?? { version: 8, sources: {}, layers: [] }, {
            transformStyle: absolutizeSpriteURLs,
          });

          return map;
        },
        getRuntimeCore(map) {
          return getCoreByMap(map) ?? null;
        },
      };
    </script>
  </body>
</html>
