<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waymark JS — Development</title>

    <style type="text/css">
      :root {
        --dev-border: #d7dbe0;
        --dev-muted: #57606a;
        --dev-surface: #f8f9fb;
        --dev-accent: #1f6feb;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        color: #1f2328;
      }

      #dev-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.5rem 0.75rem;
        background: var(--dev-surface);
        border-bottom: 1px solid var(--dev-border);
        flex-shrink: 0;
      }

      .dev-brand {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        min-width: 0;
      }

      .dev-brand__title {
        font-size: 0.9375rem;
        font-weight: 600;
      }

      .dev-brand__cue {
        font-size: 0.8125rem;
        color: var(--dev-muted);
      }

      .dev-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .dev-controls button {
        font: inherit;
        font-size: 0.8125rem;
        padding: 0.3rem 0.6rem;
        color: #1f2328;
        background: #ffffff;
        border: 1px solid var(--dev-border);
        border-radius: 4px;
        cursor: pointer;
      }

      .dev-controls button:hover {
        border-color: var(--dev-accent);
        color: var(--dev-accent);
      }

      .dev-controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.8125rem;
        color: var(--dev-muted);
      }

      #map {
        flex: 1;
        min-height: 0;
      }

      /* Consumer-owned popup property inspector. */
      .dev-popup {
        font-family: system-ui, sans-serif;
        min-width: 12rem;
        max-width: 16rem;
      }

      .dev-popup__title {
        margin: 0 0 0.5rem;
        font-size: 0.9375rem;
        line-height: 1.3;
      }

      .dev-popup__image {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 0 0.5rem;
        border-radius: 4px;
      }

      .dev-popup__table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8125rem;
      }

      .dev-popup__table th {
        text-align: left;
        vertical-align: top;
        padding: 0.15rem 0.5rem 0.15rem 0;
        color: var(--dev-muted);
        font-weight: 600;
        white-space: nowrap;
      }

      .dev-popup__table td {
        padding: 0.15rem 0;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="dev-toolbar">
      <div class="dev-brand">
        <span class="dev-brand__title">Waymark JS</span>
        <span class="dev-brand__cue"
          >Dev harness &amp; integration example — click a feature to inspect
          its properties.</span
        >
      </div>
      <div class="dev-controls">
        <button id="dev-add-layer" type="button">Add GeoJSON layer</button>
        <button id="dev-fit-bounds" type="button">Fit bounds</button>
        <button id="dev-toggle-beer" type="button">Toggle "beer" type</button>
        <label>
          <input id="dev-debug" type="checkbox" />
          Debug logging
        </label>
      </div>
    </div>
    <div id="map"></div>
    <script type="module" src="/dev.js"></script>
  </body>
</html>
